[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-forge"
version = "0.1.0"
description = "Readable Hugging Face GRPO training for mathematical reasoning"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.6,<3", "transformers==4.57.6", "peft==0.17.1",
    "accelerate>=1.0,<2", "safetensors>=0.4.3",
]

[tool.setuptools.packages.find]
include = ["reasoning_forge*"]
